<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив конспектов — Инструменты</title>
    <style>
        :root {
            --bg-main: #0a0a0c; --bg-sidebar: #111113; --bg-card: rgba(26, 26, 26, 0.45); --border-color: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-muted: #7e7e86;
            --color-lecture: #24335c; --text-lecture: #7096ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        .bg-glow-1 { position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,122,255,0.18) 0%, rgba(0,0,0,0) 70%); top: -100px; right: -50px; z-index: 1; animation: floatGlow1 12s infinite alternate ease-in-out; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 550px; height: 450px; background: radial-gradient(circle, rgba(92,219,125,0.1) 0%, rgba(0,0,0,0) 70%); bottom: -150px; left: 100px; z-index: 1; animation: floatGlow2 15s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes floatGlow1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.15); } }
        @keyframes floatGlow2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, -50px) scale(1.1); } }

        .sidebar { width: 70px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; position: relative; z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); height: 100vh; }
        .sidebar-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; transition: all 0.3s ease; }
        .sidebar-btn.logo { background: linear-gradient(135deg, #007aff, #00f0ff); color: #fff; font-size: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
        .sidebar-btn.active, .sidebar-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.06); }

        .main-content { flex-grow: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; position: relative; z-index: 10; height: 100vh; }
        .header-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        h1 a { text-decoration: none; color: inherit; }
        .subtitle { color: var(--text-muted); font-size: 14px; }

        .tools-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 20px; }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        .buttons-group { display: flex; align-items: center; gap: 12px; }

        .upload-label { background: #007aff; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0,122,255,0.2); }
        .upload-label:hover { background: #0063d1; transform: translateY(-1px); }
        #audio-upload { display: none; }

        .action-btn { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .action-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
        .action-btn.process { background: #5cdb7d; color: #0a0a0c; font-weight: 700; border: none; display: none; }
        .action-btn.process:hover { background: #4ec26e; }

        .status-badge { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; background: #7e7e86; border-radius: 50%; }
        .has-file .status-dot { background: #007aff; box-shadow: 0 0 8px #007aff; }
        .processing .status-dot { background: #ff4545; box-shadow: 0 0 8px #ff4545; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; display: none; position: relative; }
        .progress-container.visible { display: block; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #007aff, #5cdb7d); transition: width 0.2s ease; }

        .text-area-output { width: 100%; height: 320px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; color: var(--text-main); font-size: 15px; line-height: 1.6; resize: none; outline: none; }
    </style>
</head>
<body>
    <div class="bg-glow-1" id="glow1"></div><div class="bg-glow-2" id="glow2"></div>
    <div class="sidebar">
        <a href="index.html" class="sidebar-btn logo">📚</a>
        <a href="notes.html" class="sidebar-btn" title="Конспекты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </a>
        <a href="tools.html" class="sidebar-btn active" title="Инструменты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </a>
    </div>
    <div class="main-content">
        <div class="header-area"><h1><a href="notes.html">Встроенные инструменты</a></h1><div class="subtitle">Информационная панель и шлюз для обработки аудиозаписей</div></div>
        
        <div class="tools-container">
            <div class="controls-row">
                <div class="buttons-group">
                    <label class="upload-label" for="audio-upload">
                        <span>📁 Выбрать файл лекции</span>
                    </label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button class="action-btn process" id="process-file-btn">Запустить ИИ-расшифровку</button>
                </div>
                <button class="action-btn" id="copy-text-btn">Скопировать текст</button>
            </div>

            <div class="status-badge" id="status-row"><div class="status-dot"></div><span id="status-text">Система готова. Выберите аудиофайл лекции.</span></div>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <textarea class="text-area-output" id="output-textarea" readonly placeholder="Инструкция:&#10;1. Нажмите синюю кнопку 'Выбрать файл лекции' и укажите ваш файл лекции.&#10;2. Нажмите зеленую кнопку 'Запустить ИИ-расшифровку'.&#10;&#10;Поскольку файл весит более 50 МБ, браузер не сможет обработать его локально без падения вкладки. Система перенаправит вас на оптимальные бесплатные шлюзы."></textarea>
        </div>
    </div>

    <script>
        const processFileBtn = document.getElementById('process-file-btn');
        const copyBtn = document.getElementById('copy-text-btn');
        const outputText = document.getElementById('output-textarea');
        const statusText = document.getElementById('status-text');
        const statusRow = document.getElementById('status-row');
        const audioUpload = document.getElementById('audio-upload');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        let progressInterval = null;

        audioUpload.addEventListener('change', function() {
            if (this.files.length > 0) {
                const file = this.files[0]; // Исправлено: берем элемент напрямую из массива
                
                processFileBtn.style.display = 'inline-block';
                statusRow.className = 'status-badge has-file';
                statusText.innerText = `Лекция "${file.name}" успешно выбрана. Нажмите зеленую кнопку.`;
                outputText.value = '';
                progressContainer.classList.remove('visible');
                progressBar.style.width = '0%';
            }
        });

        processFileBtn.addEventListener('click', () => {
            isProcessing(true);
            outputText.value = 'Анализ размера файла и конфигурации вашей системы...';
            
            let percent = 0;
            progressInterval = setInterval(() => {
                if (percent < 95) {
                    percent += Math.floor(Math.random() * 4) + 2;
                    progressBar.style.width = `${percent}%`;
                    statusText.innerText = `Подготовка аудиопотока: ${percent}%`;
                }
            }, 150);

            setTimeout(() => {
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                statusRow.className = 'status-badge';
