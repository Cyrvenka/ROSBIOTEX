<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив конспектов — Инструменты</title>
    <style>
        :root {
            --bg-main: #0a0a0c; --bg-sidebar: #111113; --bg-card: rgba(26, 26, 26, 0.45); --border-color: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-muted: #7e7e86;
            --color-lecture: #007aff; --text-lecture: #7096ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        .bg-glow-1 { position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,122,255,0.18) 0%, rgba(0,0,0,0) 70%); top: -100px; right: -50px; z-index: 1; animation: floatGlow1 12s infinite alternate ease-in-out; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 550px; height: 450px; background: radial-gradient(circle, rgba(92,219,125,0.1) 0%, rgba(0,0,0,0) 70%); bottom: -150px; left: 100px; z-index: 1; animation: floatGlow2 15s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes floatGlow1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.15); } }
        @keyframes floatGlow2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, -50px) scale(1.1); } }

        .sidebar { width: 70px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; position: relative; z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); height: 100vh; }
        .sidebar-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; transition: all 0.3s ease; }
        .sidebar-btn.logo { background: linear-gradient(135deg, #007aff, #00f0ff); color: #fff; font-size: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
        .sidebar-btn.active, .sidebar-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.06); }

        .main-content { flex-grow: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; position: relative; z-index: 10; height: 100vh; }
        .header-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        h1 a { text-decoration: none; color: inherit; }
        .subtitle { color: var(--text-muted); font-size: 14px; }

        .tools-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 20px; }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        .buttons-group { display: flex; align-items: center; gap: 12px; }

        .gate-link { background: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0,122,255,0.2); text-decoration: none; }
        .gate-link:hover { background: #0063d1; transform: translateY(-1px); }
        .gate-link.secondary { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color); box-shadow: none; }
        .gate-link.secondary:hover { background: rgba(255,255,255,0.12); }
        .gate-link.green { background: #5cdb7d; color: #0a0a0c; font-weight: 700; box-shadow: 0 4px 12px rgba(92,219,125,0.2); }
        .gate-link.green:hover { background: #4ec26e; }

        .text-area-output { width: 100%; height: 340px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; color: var(--text-main); font-size: 15px; line-height: 1.6; resize: none; outline: none; }
        .text-area-output:focus { border-color: rgba(0,122,255,0.3); }
    </style>
</head>
<body>
    <div class="bg-glow-1" id="glow1"></div><div class="bg-glow-2" id="glow2"></div>
    <div class="sidebar">
        <a href="index.html" class="sidebar-btn logo">📚</a>
        <a href="notes.html" class="sidebar-btn" title="Конспекты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </a>
        <a href="tools.html" class="sidebar-btn active" title="Инструменты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </a>
    </div>
    <div class="main-content">
        <div class="header-area"><h1><a href="notes.html">Встроенные инструменты</a></h1><div class="subtitle">Быстрая ИИ-обработка длинных аудиозаписей лекций</div></div>
        
        <div class="tools-container">
            <div class="controls-row">
                <div class="buttons-group">
                    <a href="https://huggingface.co" target="_blank" class="gate-link">
                        🚀 Открыть ИИ-декодер Whisper
                    </a>
                    <a href="https://t.me" target="_blank" class="gate-link secondary">
                        🤖 Бот Сбера в Telegram
                    </a>
                    <button class="gate-link green" id="format-btn">🪄 Сделать конспект</button>
                </div>
                <button class="gate-link secondary" id="copy-btn">Скопировать результат</button>
            </div>

            <textarea class="text-area-output" id="input-textarea" placeholder="Инструкция для быстрого разбора:&#10;1. Нажмите первую синюю кнопку — в новой вкладке откроется официальный сверхскоростной ИИ-сервер Whisper.&#10;2. Просто перетащите туда ваш часовой MP3-файл. Через 40 секунд он выдаст полный текст.&#10;3. Скопируйте полученный текст, вернитесь на наш сайт и вставьте его сюда.&#10;4. Нажмите зеленую кнопку 'Сделать конспект' — наш скрипт уберет мусор и разобьет текст на абзацы!"></textarea>
        </div>
    </div>

    <script>
        const formatBtn = document.getElementById('format-btn');
        const copyBtn = document.getElementById('copy-btn');
        const textarea = document.getElementById('input-textarea');

        // УМНЫЙ АВТО-РЕРАЙТЕР И ФОРМАТИРОВЩИК ТЕКСТА
        formatBtn.addEventListener('click', () => {
            let text = textarea.value.trim();
            if (!text || text.startsWith("Инструкция:")) return;

            // 1. Убираем слова-паразиты и мусор, который часто генерируют ИИ при расшифровке
            const мусор = [
                /\bтак сказать\b/gi, /\bкороче\b/gi, /\bну типа\b/gi, /\bтипа того\b/gi, 
                /\bв принципе\b/gi, /\bкак бы\b/gi, /\bзначит\b/gi, /\bвот\b/gi
            ];
            мусор.forEach(regex => text = text.replace(regex, ''));

            // 2. Делаем умную разбивку длинного сплошного текста на абзацы (каждые 3-4 предложения)
            let sentences = text.match(/[^.!?]+[.!?]+(\s|$)/g);
            if (sentences) {
                let formattedText = "";
                for (let i = 0; i < sentences.length; i++) {
                    formattedText += sentences[i];
                    if ((i + 1) % 3 === 0) {
                        formattedText += "\n\n"; // Добавляем красивый абзац
                    }
                }
                text = formattedText;
            }

            textarea.value = "📝 АВТОМАТИЧЕСКИЙ КОНСПЕКТ ЛЕКЦИИ:\n\n" + text;
        });

        copyBtn.addEventListener('click', () => {
            if (!textarea.value.trim() || textarea.value.startsWith("Инструкция:")) return;
            navigator.clipboard.writeText(textarea.value);
            const orig = copyBtn.innerText; copyBtn.innerText = 'Скопировано!';
            setTimeout(() => copyBtn.innerText = orig, 1500);
        });
    </script>
</body>
</html>
