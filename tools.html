<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив конспектов — Инструменты</title>
    <style>
        :root {
            --bg-main: #0a0a0c; --bg-sidebar: #111113; --bg-card: rgba(26, 26, 26, 0.45); --border-color: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-muted: #7e7e86;
            --color-lecture: #24335c; --text-lecture: #7096ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        .bg-glow-1 { position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(0,122,255,0.18) 0%, rgba(0,0,0,0) 70%); top: -100px; right: -50px; z-index: 1; animation: floatGlow1 12s infinite alternate ease-in-out; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 550px; height: 450px; background: radial-gradient(circle, rgba(92,219,125,0.1) 0%, rgba(0,0,0,0) 70%); bottom: -150px; left: 100px; z-index: 1; animation: floatGlow2 15s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes floatGlow1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.15); } }
        @keyframes floatGlow2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, -50px) scale(1.1); } }

        .sidebar { width: 70px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; position: relative; z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); height: 100vh; }
        .sidebar-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; transition: all 0.3s ease; }
        .sidebar-btn.logo { background: linear-gradient(135deg, #007aff, #00f0ff); color: #fff; font-size: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
        .sidebar-btn.active, .sidebar-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.06); }

        .main-content { flex-grow: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; position: relative; z-index: 10; height: 100vh; }
        .header-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        h1 a { text-decoration: none; color: inherit; }
        .subtitle { color: var(--text-muted); font-size: 14px; }

        .tools-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; height: calc(100vh - 160px); overflow: hidden; }
        
        /* ОБЛАЧНЫЙ ИИ-ИНТЕРФЕЙС БЕЗ НАГРУЗКИ НА ПК */
        iframe { width: 100%; height: 100%; border: none; border-radius: 12px; background: #0b0b0f; }
    </style>
</head>
<body>
    <div class="bg-glow-1" id="glow1"></div><div class="bg-glow-2" id="glow2"></div>
    <div class="sidebar">
        <a href="index.html" class="sidebar-btn logo">📚</a>
        <a href="notes.html" class="sidebar-btn" title="Конспекты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </a>
        <a href="tools.html" class="sidebar-btn active" title="Инструменты">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </a>
    </div>
    <div class="main-content">
        <div class="header-area"><h1><a href="notes.html">Встроенные инструменты</a></h1><div class="subtitle">Автономное ИИ-распознавание аудиофайлов лекций в текст (Облачный Whisper)</div></div>
        
        <div class="tools-container">
            <!-- Стабильный облачный ИИ-движок без блокировок и без связи с ПК -->
            <iframe src="https://hf.space" allow="microphone"></iframe>
        </div>
    </div>

    <script>
        const time = Date.now() / 1000;
        document.documentElement.style.setProperty('--glow-delay-1', `-${time % 12}s`);
        document.documentElement.style.setProperty('--glow-delay-2', `-${time % 15}s`);
    </script>
</body>
</html>
